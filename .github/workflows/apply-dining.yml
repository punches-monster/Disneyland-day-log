name: Apply Dining Log Update

on:
  push:
    paths:
      - 'tools/apply_dining_patch.py'
      - '.github/workflows/apply-dining.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python tools/apply_dining_patch.py
      - name: Commit updated app
        run: |
          if git diff --quiet -- index.html; then
            echo "No app changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add dining log to day logger"
          git push
