name: Add Pixar Short Film Spotlight
on:
  push:
    paths:
      - '.github/workflows/add-pixar-short-film.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add attraction and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          name = "Pixar Short Film Spotlight"
          if name in s:
              raise SystemExit('Attraction already present')
          needle = "['Pirates of the Caribbean','New Orleans Square'],"
          repl = needle + "['Pixar Short Film Spotlight','Tomorrowland'],"
          if needle not in s:
              raise SystemExit('Insertion point not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace("disneyland-day-log-v2", "disneyland-day-log-v3")
          sw.write_text(w, encoding='utf-8')
          assert s.count("Pixar Short Film Spotlight") == 1
          assert "['Pixar Short Film Spotlight','Tomorrowland']" in s
          assert "disneyland-day-log-v3" in w
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Add Pixar Short Film Spotlight to Disneyland'
          git push
